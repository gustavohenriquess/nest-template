name: E2E Tests

on:
  workflow_call:

jobs:
  e2e_tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: bitnami/postgresql:latest
        env:
          POSTGRESQL_USERNAME: bn_user
          POSTGRESQL_PASSWORD: bn_password
          POSTGRESQL_DATABASE: nest_db
        options: >-
          --health-cmd="pg_isready -U bn_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432

    env:
      GCP_PRIMARY_PROJECT_ID: ci-project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nest_db
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nest_db

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: node-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'prisma/schema.prisma') }}

      - name: Prisma Migrate Deploy
        run: npx prisma migrate deploy

      - name: Run E2E Tests
        run: npm run test:e2e
