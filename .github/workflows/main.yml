name: CI Orchestration

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/release.yml'

jobs:
  # The "Do Once" root
  setup:
    uses: ./.github/workflows/_setup.yml

  # The parallel "Break into More" branches
  quality:
    needs: setup
    uses: ./.github/workflows/_quality.yml

  tests:
    needs: setup
    uses: ./.github/workflows/_tests.yml

  # E2E depends on Quality and Unit Tests to fail fast and save resources
  e2e-tests:
    needs: [quality, tests]
    uses: ./.github/workflows/_e2e-tests.yml
