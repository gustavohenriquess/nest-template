receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed

  # O exporter 'loki' foi removido do contrib. Loki 3.x aceita OTLP nativamente.
  # Usamos otlphttp com um alias /loki para não conflitar com o exporter 'otlp' (Jaeger).
  # IMPORTANTE: o otlphttp acrescenta /v1/logs automaticamente ao endpoint.
  # Então o endpoint base deve ser apenas http://loki:3100/otlp
  otlphttp/loki:
    endpoint: ${LOKI_OTLP_ENDPOINT}
    tls:
      insecure: true

  otlp:
    endpoint: ${JAEGER_URL}
    tls:
      insecure: true

  datadog:
    hostname: "nest-template-otelcol"
    api:
      site: ${DD_URL}
      key: ${DD_KEY}

processors:
  batch:
    send_batch_max_size: 100
    send_batch_size: 10
    timeout: 10s

extensions:
  health_check: {}

connectors:
    datadog/connector:

service:
  telemetry:
    logs:
      level: debug

  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      # debug: exibe os logs no console do Collector para validação local
      # loki: envia para o Loki para visualização no Grafana
      exporters: [debug, otlphttp/loki]
